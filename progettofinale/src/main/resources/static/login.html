<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow – Accedi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-icon">✓</div>
      <span class="auth-logo-text">TaskFlow</span>
    </div>

    <div class="auth-heading">
      <h1>Bentornato</h1>
      <p>Inserisci le tue credenziali per continuare</p>
    </div>

    <div id="formAlert" class="alert"></div>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <div class="input-wrap">
          <span class="i-icon">✉</span>
          <input class="form-control" type="email" id="email"
            placeholder="nome@esempio.com" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="i-icon">🔒</span>
          <input class="form-control" type="password" id="password"
            placeholder="La tua password" autocomplete="current-password" required>
          <button type="button" class="btn-pw-eye" id="togglePw">👁</button>
        </div>
      </div>

      <button type="submit" class="btn-auth" id="submitBtn">Accedi</button>

    </form>

    <div class="auth-footer">
      Non hai un account? <a href="register.html">Registrati gratis</a>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
