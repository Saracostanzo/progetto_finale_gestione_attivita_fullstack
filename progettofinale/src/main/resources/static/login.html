<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – TaskFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h1>TaskFlow</h1>
        <h2>Accedi al tuo account</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="la tua email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="la tua password">
            </div>

            <p id="errMsg" class="error-msg"></p>

            <button type="submit" class="btn-primary btn-full">Accedi</button>
        </form>

        <p class="auth-link">Non hai un account? <a href="register.html">Registrati</a></p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
