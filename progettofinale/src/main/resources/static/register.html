<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione – TaskFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h1>TaskFlow</h1>
        <h2>Crea un account</h2>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="il tuo username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="la tua email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="almeno 6 caratteri">
            </div>
            <div class="form-group">
                <label for="confirm">Conferma password</label>
                <input type="password" id="confirm" placeholder="ripeti la password">
            </div>

            <p id="errMsg" class="error-msg"></p>

            <button type="submit" class="btn-primary btn-full">Registrati</button>
        </form>

        <p class="auth-link">Hai già un account? <a href="login.html">Accedi</a></p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
