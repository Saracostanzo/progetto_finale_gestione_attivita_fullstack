<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – TaskFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h1>TaskFlow</h1>
        <div class="navbar-right">
            <span id="welcomeUser"></span>
            <button onclick="logout()" class="btn-outline">Esci</button>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="container">

        <!-- Toolbar: filtri + bottone nuovo task -->
        <div class="toolbar">
            <button onclick="openModal()" class="btn-primary">+ Nuovo Task</button>

            <select id="filtroStato" onchange="caricaTask()">
                <option value="">Tutti gli stati</option>
                <option value="DAFARE">Da fare</option>
                <option value="INCORSO">In corso</option>
                <option value="COMPLEATATO">Completato</option>
            </select>

            <select id="filtroPriorita" onchange="caricaTask()">
                <option value="">Tutte le priorità</option>
                <option value="ALTA">Alta</option>
                <option value="MEDIA">Media</option>
                <option value="BASSA">Bassa</option>
            </select>
        </div>

        <!-- Tabella dei task -->
        <table id="taskTable">
            <thead>
                <tr>
                    <th>Titolo</th>
                    <th>Stato</th>
                    <th>Priorità</th>
                    <th>Scadenza</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="taskBody">
                <!-- Le righe vengono aggiunte da JavaScript -->
            </tbody>
        </table>

        <p id="emptyMsg" class="empty-msg">Nessun task trovato.</p>

    </main>

    <!-- MODAL crea / modifica task -->
    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modalTitle">Nuovo Task</h2>

            <form id="taskForm">
                <div class="form-group">
                    <label for="inputTitolo">Titolo *</label>
                    <input type="text" id="inputTitolo" placeholder="titolo del task">
                </div>
                <div class="form-group">
                    <label for="inputDescrizione">Descrizione</label>
                    <textarea id="inputDescrizione" rows="3" placeholder="descrizione (opzionale)"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="inputStato">Stato</label>
                        <select id="inputStato">
                            <option value="DAFARE">Da fare</option>
                            <option value="INCORSO">In corso</option>
                            <option value="COMPLEATATO">Completato</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inputPriorita">Priorità</label>
                        <select id="inputPriorita">
                            <option value="MEDIA">Media</option>
                            <option value="ALTA">Alta</option>
                            <option value="BASSA">Bassa</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="inputScadenza">Data di scadenza</label>
                    <input type="datetime-local" id="inputScadenza">
                </div>

                <p id="modalErr" class="error-msg"></p>

                <div class="modal-buttons">
                    <button type="button" onclick="closeModal()" class="btn-outline">Annulla</button>
                    <button type="submit" class="btn-primary">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
